<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Italiensk ord</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f4;margin:0;color:#222}
.app{max-width:600px;margin:auto;padding:25px 18px}
h1{text-align:center}
.card{background:white;padding:28px 22px;border-radius:20px;box-shadow:0 4px 15px #0001;margin:20px 0}
.word{text-align:center;font-size:42px;font-weight:700;margin:10px}
.translation{text-align:center;font-size:23px;margin:15px}
.info{background:#f4f4f4;padding:15px;border-radius:12px;line-height:1.5}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:13px;font-size:18px;font-weight:600}
.next{background:#222;color:white}
.save{background:#e5e5ea}
.savedButton{background:#d8f5df}
.listButton{background:white;border:1px solid #ccc}
.savedList{display:none}
.item{background:#f4f4f4;padding:13px;border-radius:10px;margin:8px 0}
.remove{width:auto;padding:7px 10px;font-size:14px}
.fact{font-size:19px;line-height:1.5}
.counter{text-align:center;color:#777;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="app">
<h1>Italiensk hver dag 🇮🇹</h1>

<div id="wordCard" class="card">
<div id="word" class="word"></div>
<div id="translation" class="translation"></div>
<div id="info" class="info"></div>
<button id="saveBtn" class="save" onclick="saveWord()">☆ Lagre ord</button>
<button class="next" onclick="next()">Neste ord →</button>
<div id="counter" class="counter"></div>
</div>

<div id="factCard" class="card" style="display:none">
<h2>🇮🇹 Fakta om Italia</h2>
<div id="fact" class="fact"></div>
<button class="next" onclick="next()">Neste ord →</button>
</div>

<button class="listButton" onclick="showSaved()">📚 Lagrede ord</button>

<div id="savedList" class="card savedList">
<h2>Lagrede ord</h2>
<div id="savedWords"></div>
</div>
</div>

<script>
const words=[
["affidarsi","å stole på / overlate seg til","Mi affido a te.","Et refleksivt verb som brukes når man stoler på eller overlater seg til noen."],
["riuscire","å klare / lykkes med","Non riesco a dormire.","Brukes ofte som riuscire a + infinitiv."],
["scegliere","å velge","Devo scegliere un ristorante.","Et svært vanlig verb."],
["accorgersi","å legge merke til / oppdage","Mi sono accorto dell'errore.","Refleksivt verb, ofte brukt når man plutselig oppdager noe."],
["invece","i stedet / derimot","Io invece preferisco il caffè.","Brukes for å sette to ting opp mot hverandre."],
["ancora","fortsatt / ennå / igjen","Abito ancora qui.","Betydningen varierer med sammenhengen."],
["appena","nettopp / så snart","Sono appena arrivato.","Et vanlig adverb med flere betydninger."],
["magari","kanskje / gjerne / om bare","Magari domani!","Et svært vanlig og fleksibelt italiensk ord."],
["comunque","uansett / likevel","Comunque, andiamo.","Svært vanlig i dagligtale."],
["allora","da / altså / i så fall","Allora, che facciamo?","Et av de vanligste italienske småordene."],
["soprattutto","særlig / framfor alt","Mi piace soprattutto la montagna.","Brukes for å fremheve noe."],
["abbastanza","ganske / tilstrekkelig","È abbastanza facile.","Kan bety både ganske og nok."],
["diventare","å bli","Vuole diventare medico.","Brukes om overgang fra én tilstand til en annen."],
["mancare","å mangle / savne","Mi manca l'Italia.","Mi manca betyr omtrent «jeg savner»."],
["voglia","lyst","Ho voglia di un caffè.","Avere voglia di betyr å ha lyst på eller til noe."],
["vicino","nær","Il bar è vicino.","Kan brukes om både avstand og personer."],
["lontano","langt borte","La stazione è lontana.","Motsatt av vicino."],
["presto","tidlig / snart","A presto!","Kan bety både tidlig og snart."],
["subito","med en gang","Arrivo subito.","Svært vanlig i dagligtale."],
["davvero","virkelig","È davvero bello.","Brukes for å forsterke et utsagn."],
["forse","kanskje","Forse domani.","Uttrykker usikkerhet."],
["spesso","ofte","Vado spesso in Italia.","Et vanlig tidsadverb."],
["quasi","nesten","Sono quasi arrivato.","Betyr at noe er nær ved å være fullført."],
["insieme","sammen","Andiamo insieme.","Et nyttig hverdagsord."],
["sembrare","å virke / se ut til","Sembra facile.","Brukes når noe virker å være på en bestemt måte."],
["sapere","å vite / kunne","Non lo so.","Brukes om kunnskap og det å vite noe."],
["conoscere","å kjenne","Conosco bene Roma.","Brukes om personer, steder og ting man kjenner."],
["mettere","å legge / sette / ta på","Metto le chiavi sul tavolo.","Et svært vanlig verb med mange bruksområder."],
["portare","å ta med / bære","Porto il vino.","Brukes når man tar eller bærer noe med seg."],
["prendere","å ta","Prendo un caffè.","Brukes blant annet om mat, drikke og transport."],
["lasciare","å forlate / la","Lascio la macchina qui.","Kan bety både å forlate og å la noe være."],
["trovare","å finne","Non trovo le chiavi.","Et svært vanlig verb."],
["pensare","å tenke / tro","Penso di sì.","Penso di sì betyr omtrent «jeg tror det»."],
["credere","å tro","Credo di sì.","Brukes om hva man tror eller mener."],
["capire","å forstå","Non capisco.","Et viktig verb når man lærer italiensk."],
["dimenticare","å glemme","Ho dimenticato le chiavi.","Vanlig verb, særlig nyttig i fortid."],
["ricordare","å huske","Ricordo quel giorno.","Kan også brukes refleksivt: ricordarsi."],
["aspettare","å vente","Ti aspetto qui.","Ti aspetto betyr «jeg venter på deg»."],
["chiedere","å spørre / be om","Posso chiedere una cosa?","Kan bety både spørre og be om."],
["rispondere","å svare","Devo rispondere.","Brukes ofte med a: rispondere a qualcuno."],
["succedere","å skje","Che cosa è successo?","Che cosa è successo? betyr «Hva skjedde?»."]
];

const facts=[
"Roma har vært en viktig by i mer enn to tusen år og var sentrum i Romerriket.",
"Vatikanstaten og San Marino er to selvstendige stater som ligger innenfor Italias geografiske område.",
"Italia består av 20 regioner, med tydelige forskjeller i mat, kultur og dialekter.",
"Napoli forbindes sterkt med opprinnelsen til den moderne pizzaen.",
"Sicilia er den største øya i Middelhavet.",
"Etna på Sicilia er en av Europas mest aktive vulkaner.",
"Venezias historiske sentrum er bygget på øyer i en lagune.",
"Bologna er kjent for Universitetet i Bologna, som regnes blant Europas eldste universiteter.",
"Milano er et internasjonalt sentrum for mote og design.",
"Italiensk utviklet seg fra latin og tilhører den romanske språkfamilien.",
"Alpene danner en stor del av Italias nordlige grense.",
"Roma er Italias hovedstad, mens Milano er landets nest største byområde og et viktig økonomisk sentrum."
];

let index=0;
let clicks=0;
let saved=JSON.parse(localStorage.getItem("savedItalianWords")||"[]");

function displayWord(){
 document.getElementById("factCard").style.display="none";
 document.getElementById("wordCard").style.display="block";
 const w=words[index];
 document.getElementById("word").textContent=w[0];
 document.getElementById("translation").textContent=w[1];
 document.getElementById("info").innerHTML="<b>Forklaring:</b> "+w[3]+"<br><br><b>Eksempel:</b> <i>"+w[2]+"</i>";
 document.getElementById("counter").textContent=(index+1)+" / "+words.length+" ord";
 updateSave();
}

function next(){
 clicks++;
 if(clicks%10===0){
   document.getElementById("wordCard").style.display="none";
   document.getElementById("factCard").style.display="block";
   document.getElementById("fact").textContent=facts[(clicks/10-1)%facts.length];
 }else{
   index=(index+1)%words.length;
   displayWord();
 }
}

function saveWord(){
 const w=words[index];
 const pos=saved.findIndex(x=>x[0]===w[0]);
 if(pos===-1) saved.push(w); else saved.splice(pos,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 updateSave();
 renderSaved();
}

function updateSave(){
 const yes=saved.some(x=>x[0]===words[index][0]);
 const b=document.getElementById("saveBtn");
 b.textContent=yes?"★ Lagret":"☆ Lagre ord";
 b.className=yes?"save savedButton":"save";
}

function showSaved(){
 const el=document.getElementById("savedList");
 el.style.display=el.style.display==="block"?"none":"block";
 renderSaved();
}

function renderSaved(){
 const el=document.getElementById("savedWords");
 if(!saved.length){el.innerHTML="<p>Ingen lagrede ord ennå.</p>";return;}
 el.innerHTML=saved.map((w,i)=>"<div class='item'><b>"+w[0]+"</b> – "+w[1]+"<br><button class='remove' onclick='removeWord("+i+")'>Fjern</button></div>").join("");
}

function removeWord(i){
 saved.splice(i,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 renderSaved();
 updateSave();
}

displayWord();
renderSaved();
</script>
</body>
</html>
