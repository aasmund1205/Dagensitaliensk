// Kvalitetssikring av ordlisten: fjern dubletter og blokker ugyldige oversettelser.
// Dette gjør også at gamle placeholder-verdier ikke kan vises dersom en eldre versjon
// av appen ligger lagret i nettleseren.
const INVALID_TRANSLATIONS = /^(se\s+forklaring|forklaring|se\s+mer|ukjent|undefined|null|-)$/i;
const seenWords = new Set();
for (let i = words.length - 1; i >= 0; i--) {
  const w = words[i];
  const key = String(w[0] || "").trim().toLocaleLowerCase("it");
  const translation = String(w[1] || "").trim();
  if (!key || !translation || INVALID_TRANSLATIONS.test(translation) || seenWords.has(key)) {
    words.splice(i, 1);
  } else {
    seenWords.add(key);
  }
}

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function previous(){
  if(wordHistory.length === 0) return;
  const previousIndex = wordHistory.pop();
  if (typeof currentIndex !== "undefined") {
    currentIndex = previousIndex;
    if (typeof showWord === "function") showWord();
    else if (typeof displayWord === "function") displayWord();
  } else if (typeof queuePos !== "undefined" && queuePos > 0) {
    queuePos--;
    if (typeof displayWord === "function") displayWord();
  }
}

function next(){
  if (typeof currentIndex !== "undefined" && !navigatingBack) wordHistory.push(currentIndex);
 clicks++;
 recordWordClick();
 queuePos++;
 if(queuePos>=queue.length) resetQueue();
 displayWord();
}

function saveWord(){
 const w=currentWord();
 const pos=saved.findIndex(x=>x[0]===w[0]);
 if(pos===-1) saved.push(w); else saved.splice(pos,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 updateSave();
 renderSaved();
}

function updateSave(){
 const current=currentWord();
 const yes=current && saved.some(x=>x[0]===current[0]);
 const b=document.getElementById("saveBtn");
 b.textContent=yes?"★ Lagret":"☆ Lagre ord";
 b.className=yes?"save savedButton":"save";
}

 const el=document.getElementById("savedList");

 renderSaved();
}
