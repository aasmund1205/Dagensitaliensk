let index=0;
let clicks=0;
let queue=[];
let queuePos=0;
let selectedType=localStorage.getItem("italianWordType")||"all";

function filteredWords(){
 return selectedType==="all" ? words : words.filter(w=>w[4]===selectedType);
}

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function updateStats(){
 const all=words.length;
 const v=words.filter(w=>w[4]==="verb").length;
 const n=words.filter(w=>w[4]==="noun").length;
 const a=words.filter(w=>w[4]==="adjective").length;
 document.getElementById("vocabStats").textContent=all+" ord totalt • "+v+" verb • "+n+" substantiv • "+a+" adjektiv";
}

function resetQueue(){
 queue=shuffle(filteredWords());
 queuePos=0;
 index=0;
}

function currentWord(){
 if(!queue.length || queuePos>=queue.length) resetQueue();
 return queue[queuePos];
}

function changeType(){
 selectedType=document.getElementById("wordType").value;
 localStorage.setItem("italianWordType",selectedType);
 resetQueue();
 displayWord();
}
let saved=JSON.parse(localStorage.getItem("savedItalianWords")||"[]");

function displayWord(){
 document.getElementById("factCard").style.display="none";
 document.getElementById("wordCard").style.display="block";
 const w=currentWord();
 document.getElementById("word").textContent=w[0];
 document.getElementById("translation").textContent=w[1];
 document.getElementById("info").innerHTML="<b>Oversettelse:</b> "+w[1]+"<br><br><b>Eksempel:</b> <i>"+w[2]+"</i><br><br><b>Merknad:</b> "+w[3];
 document.getElementById("counter").textContent=(queuePos+1)+" / "+filteredWords().length+" før listen blandes på nytt";
 updateSave();
}

function next(){
 clicks++;
 if(clicks%10===0){
   document.getElementById("wordCard").style.display="none";
   document.getElementById("factCard").style.display="block";
   document.getElementById("fact").textContent=facts[(clicks/10-1)%facts.length];
 }else{
   queuePos++;
   if(queuePos>=queue.length) resetQueue();
   displayWord();
 }
}

function saveWord(){
 const w=currentWord();
 const pos=saved.findIndex(x=>x[0]===w[0]);
 if(pos===-1) saved.push(w); else saved.splice(pos,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 updateSave();
 renderSaved();
}

function updateSave(){
 const current=currentWord();
 const yes=current && saved.some(x=>x[0]===current[0]);
 const b=document.getElementById("saveBtn");
 b.textContent=yes?"★ Lagret":"☆ Lagre ord";
 b.className=yes?"save savedButton":"save";
}

function showSaved(){
 const el=document.getElementById("savedList");
 el.style.display=el.style.display==="block"?"none":"block";
 renderSaved();
}

function renderSaved(){
 const el=document.getElementById("savedWords");
 if(!saved.length){el.innerHTML="<p>Ingen lagrede ord ennå.</p>";return;}
 el.innerHTML=saved.map((w,i)=>"<div class='item'><b>"+w[0]+"</b> – "+w[1]+"<br><button class='remove' onclick='removeWord("+i+")'>Fjern</button></div>").join("");
}

function removeWord(i){
 saved.splice(i,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 renderSaved();
 updateSave();
}

document.getElementById("wordType").value=selectedType;
updateStats();
resetQueue();
displayWord();
renderSaved();
</script>
