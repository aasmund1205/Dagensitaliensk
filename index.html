<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dagens italiensk</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#171717;--muted:#666;--accent:#c62828;--line:#e6e6e6}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
header{text-align:center;padding:8px 0 18px} h1{font-size:29px;margin:0 0 4px} .sub{color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:25px 22px;box-shadow:0 5px 24px #0000000d}
.date{text-align:center;color:var(--muted);font-size:14px;margin-bottom:16px}.word{text-align:center;font-size:46px;font-weight:750;margin:4px 0}.type{text-align:center;color:var(--accent);font-weight:650;margin-bottom:20px}.translation{text-align:center;font-size:25px;font-weight:650;margin-bottom:20px}
.section{border-top:1px solid var(--line);padding-top:17px;margin-top:17px}.label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:7px}
.example{font-size:18px;line-height:1.5}.example em{font-style:normal;font-weight:650}.nor{color:var(--muted)}
.buttons{display:flex;gap:10px;margin-top:22px}.btn{flex:1;border:0;border-radius:14px;padding:13px 10px;font-size:16px;font-weight:650;background:#eee}.primary{background:var(--accent);color:white}
.bottom{display:flex;gap:10px;margin-top:14px}.bottom button{flex:1}.saved{margin-top:18px;text-align:center;color:var(--muted);font-size:14px}
.quiz{display:none;margin-top:14px}.quiz.show{display:block}.answers{display:grid;gap:9px;margin-top:12px}.answer{background:#f0f0f2;border:0;border-radius:13px;padding:13px;text-align:left;font-size:16px}.answer.correct{background:#dff5e5}.answer.wrong{background:#fde1e1}
.note{margin-top:18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.45}
</style>
</head>
<body>
<main>
<header><h1>🇮🇹 Dagens italiensk</h1><div class="sub">Ett nytt italiensk ord hver dag</div></header>
<section class="card">
  <div class="date" id="date"></div>
  <div class="word" id="word"></div>
  <div class="type" id="type"></div>
  <div class="translation" id="translation"></div>

  <div class="section"><div class="label">Forklaring</div><div id="explanation"></div></div>
  <div class="section"><div class="label">Eksempel</div><div class="example" id="example"></div></div>

  <div class="buttons">
    <button class="btn primary" onclick="speak()">🔊 Uttale</button>
    <button class="btn" onclick="saveWord()">⭐ Lagre</button>
  </div>
  <div class="bottom">
    <button class="btn" onclick="showQuiz()">📝 Miniquiz</button>
  </div>
  <div class="quiz" id="quiz">
    <div class="label">Hva betyr ordet?</div>
    <div class="answers" id="answers"></div>
    <div id="quizResult" class="saved"></div>
  </div>
  <div id="saved" class="saved"></div>
</section>
<div class="note">Tips: I Safari kan du velge <b>Del → Legg til på Hjem-skjerm</b> for å bruke den som en app.</div>
</main>
<script>
const words=[
{w:"oggi",t:"i dag",p:"adverb",e:"Brukes når du snakker om denne dagen.",ex:"Oggi vado al lavoro.",no:"I dag drar jeg på jobb."},
{w:"affidarsi",t:"å stole på / overlate seg til",p:"refleksivt verb",e:"Brukes når man stoler på noen eller legger noe i noens hender.",ex:"Mi affido a te.",no:"Jeg stoler på deg."},
{w:"soltanto",t:"bare / kun",p:"adverb",e:"Brukes for å begrense noe. Ofte omtrent som «bare» eller «kun».",ex:"Voglio soltanto un caffè.",no:"Jeg vil bare ha en kaffe."},
{w:"maledetto",t:"forbannet / jævla",p:"adjektiv",e:"Et sterkt ord som uttrykker irritasjon eller forbannelse.",ex:"Quel maledetto traffico!",no:"Den forbannede trafikken!"},
{w:"sbrigarsi",t:"å skynde seg",p:"refleksivt verb",e:"Brukes når noen må gjøre noe raskere.",ex:"Devo sbrigarmi.",no:"Jeg må skynde meg."},
{w:"allora",t:"da / altså / så",p:"adverb",e:"Et svært vanlig ord med flere betydninger. Brukes blant annet for å gå videre i samtalen.",ex:"Allora, cosa facciamo?",no:"Så, hva gjør vi?"},
{w:"comunque",t:"uansett / likevel",p:"adverb",e:"Brukes når noe gjelder til tross for det som nettopp er sagt.",ex:"Comunque, vengo con te.",no:"Uansett blir jeg med deg."},
{w:"magari",t:"kanskje / om bare",p:"adverb",e:"Kan uttrykke mulighet eller et ønske, avhengig av sammenhengen.",ex:"Magari domani.",no:"Kanskje i morgen."},
{w:"vicino",t:"nær / i nærheten",p:"adjektiv/adverb",e:"Brukes om noe som er nært i avstand.",ex:"Il ristorante è vicino.",no:"Restauranten er i nærheten."},
{w:"bisogno",t:"behov",p:"substantiv",e:"Ofte brukt i uttrykket «avere bisogno di» – å trenge.",ex:"Ho bisogno di aiuto.",no:"Jeg trenger hjelp."},
{w:"scegliere",t:"å velge",p:"verb",e:"Brukes når du velger mellom flere alternativer.",ex:"Devo scegliere un ristorante.",no:"Jeg må velge en restaurant."},
{w:"riuscire",t:"å klare / lykkes med",p:"verb",e:"Ofte brukt med «a» + infinitiv: riuscire a fare qualcosa.",ex:"Riesco a capirlo.",no:"Jeg klarer å forstå det."}
];

const key=new Date().toISOString().slice(0,10);
const idx=Math.floor(new Date(key).getTime()/86400000)%words.length;
const x=words[(idx+words.length)%words.length];
document.getElementById("date").textContent=new Date().toLocaleDateString("no-NO",{weekday:"long",day:"numeric",month:"long"});
document.getElementById("word").textContent=x.w;
document.getElementById("type").textContent=x.p;
document.getElementById("translation").textContent=x.t;
document.getElementById("explanation").textContent=x.e;
document.getElementById("example").innerHTML="<em>"+x.ex+"</em><br><span class='nor'>"+x.no+"</span>";

function speak(){if("speechSynthesis" in window){let u=new SpeechSynthesisUtterance(x.w);u.lang="it-IT";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}}
function saveWord(){let a=JSON.parse(localStorage.getItem("italianSaved")||"[]");if(!a.includes(x.w)){a.push(x.w);localStorage.setItem("italianSaved",JSON.stringify(a));}document.getElementById("saved").textContent="⭐ Lagret. Du har lagret "+a.length+" ord."}
function showQuiz(){
 document.getElementById("quiz").classList.add("show");
 let others=words.filter(y=>y.w!==x.w).sort(()=>Math.random()-.5).slice(0,3);
 let opts=[x,...others].sort(()=>Math.random()-.5);
 document.getElementById("answers").innerHTML=opts.map(y=>`<button class="answer" onclick="answer(this,'${y.w}')">${y.t}</button>`).join("");
 document.getElementById("quizResult").textContent="";
}
function answer(el,w){let ok=w===x.w;document.querySelectorAll(".answer").forEach(b=>b.disabled=true);el.classList.add(ok?"correct":"wrong");document.getElementById("quizResult").textContent=ok?"Riktig! 🎉":"Ikke helt. Riktig svar er «"+x.t+"»."}
</script>
</body>
</html>
