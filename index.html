.counter{text-align:center;color:#777;margin-top:12px;font-size:14px}

.settings label{display:block;font-weight:600;margin-bottom:8px}

// Kvalitetssikring av ordlisten: fjern dubletter og blokker ugyldige oversettelser.
// Dette gjør også at gamle placeholder-verdier ikke kan vises dersom en eldre versjon
// av appen ligger lagret i nettleseren.
const INVALID_TRANSLATIONS = /^(se\s+forklaring|forklaring|se\s+mer|ukjent|undefined|null|-)$/i;
const seenWords = new Set();
for (let i = words.length - 1; i >= 0; i--) {
  const w = words[i];
  const key = String(w[0] || "").trim().toLocaleLowerCase("it");
  const translation = String(w[1] || "").trim();
  if (!key || !translation || INVALID_TRANSLATIONS.test(translation) || seenWords.has(key)) {
    words.splice(i, 1);
  } else {
    seenWords.add(key);
  }
}

let index=0;
let clicks=0;
let sessionWordClicks=0;
let activity=JSON.parse(localStorage.getItem("italianActivity")||'{"total":0,"days":{}}');
if(!activity.days) activity.days={};
if(!activity.total) activity.total=0;
let queue=[];
let queuePos=0;
let selectedType=localStorage.getItem("italianWordType")||"all";

function filteredWords(){
 return selectedType==="all" ? words : words.filter(w=>w[4]===selectedType);
}

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function resetQueue(){
 queue=shuffle(filteredWords());
 queuePos=0;
 index=0;
}

function currentWord(){
 if(!queue.length || queuePos>=queue.length) resetQueue();
 return queue[queuePos];
}

function changeType(){
 selectedType=document.getElementById("wordType").value;
 localStorage.setItem("italianWordType",selectedType);
 resetQueue();
 displayWord();
}
let saved=JSON.parse(localStorage.getItem("savedItalianWords")||"[]");
// Oppgrader lagrede ord fra eldre versjoner til den kvalitetssikrede ordlisten.
// Dermed forsvinner gamle «Se forklaring»-oversettelser fra localStorage.
const canonicalByWord = new Map(words.map(w=>[String(w[0]).toLocaleLowerCase("it"), w]));
saved = saved
  .map(w=>canonicalByWord.get(String((w&&w[0])||"").toLocaleLowerCase("it")))
  .filter(Boolean);
saved = [...new Map(saved.map(w=>[String(w[0]).toLocaleLowerCase("it"),w])).values()];
localStorage.setItem("savedItalianWords",JSON.stringify(saved));

function cleanNorwegianMeaning(text){
 return String(text||"").replace(/^å\s+/,"").split(" / ")[0];
}


function todayKey(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function recordWordClick(){
 sessionWordClicks++;
 activity.total++;
 const day=todayKey();
 activity.days[day]=(activity.days[day]||0)+1;
 localStorage.setItem("italianActivity",JSON.stringify(activity));
 renderActivity();
}

function displayWord(){

 const w=currentWord();
 document.getElementById("word").textContent=w[0];
 document.getElementById("translation").textContent=w[1];
  document.getElementById("info").style.display="block";

 updateSave();
}

function previous(){
  if(wordHistory.length === 0) return;
  const previousIndex = wordHistory.pop();
  if (typeof currentIndex !== "undefined") {
    currentIndex = previousIndex;
    if (typeof showWord === "function") showWord();
    else if (typeof displayWord === "function") displayWord();
  } else if (typeof queuePos !== "undefined" && queuePos > 0) {
    queuePos--;
    if (typeof displayWord === "function") displayWord();
  }
}

function next(){
  if (typeof currentIndex !== "undefined" && !navigatingBack) wordHistory.push(currentIndex);
 clicks++;
 recordWordClick();
 queuePos++;
 if(queuePos>=queue.length) resetQueue();
 displayWord();
}

function saveWord(){
 const w=currentWord();
 const pos=saved.findIndex(x=>x[0]===w[0]);
 if(pos===-1) saved.push(w); else saved.splice(pos,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 updateSave();
 renderSaved();
}

function updateSave(){
 const current=currentWord();
 const yes=current && saved.some(x=>x[0]===current[0]);
 const b=document.getElementById("saveBtn");
 b.textContent=yes?"★ Lagret":"☆ Lagre ord";
 b.className=yes?"save savedButton":"save";
}

function showSaved(){
 const el=document.getElementById("savedList");
 el.style.display=el.style.display==="block"?"none":"block";
 renderSaved();
}

function renderSaved(){
 const el=document.getElementById("savedWords");
 if(!saved.length){el.innerHTML="<p>Ingen lagrede ord ennå.</p>";return;}
 el.innerHTML=saved.map((w,i)=>"<div class='item'><b>"+w[0]+"</b> – "+w[1]+"<br><button class='remove' onclick='removeWord("+i+")'>Fjern</button></div>").join("");
}

function removeWord(i){
 saved.splice(i,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 renderSaved();
 updateSave();
}

document.getElementById("wordType").value=selectedType;
resetQueue();
displayWord();
renderSaved();
renderActivity();
