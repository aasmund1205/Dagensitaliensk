.app{max-width:600px;margin:auto;padding:25px 18px}
h1{text-align:center}
.card{background:white;padding:28px 22px;border-radius:20px;box-shadow:0 4px 15px #0001;margin:20px 0}
.word{text-align:center;font-size:42px;font-weight:700;margin:10px}
.translation{text-align:center;font-size:23px;margin:15px}
.info{background:#f4f4f4;padding:15px;border-radius:12px;line-height:1.5}

button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:13px;font-size:18px;font-weight:600}
.next{background:#222;color:white}
.save{background:#e5e5ea}
.savedButton{background:#d8f5df}
.listButton{background:white;border:1px solid #ccc}
.savedList{display:none}
.item{background:#f4f4f4;padding:13px;border-radius:10px;margin:8px 0}
.remove{width:auto;padding:7px 10px;font-size:14px}
.fact{font-size:19px;line-height:1.5}
.counter{text-align:center;color:#777;margin-top:12px;font-size:14px}
.settings{background:white;padding:18px;border-radius:16px;margin:15px 0}
.settings label{display:block;font-weight:600;margin-bottom:8px}
.settings select{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;font-size:17px;background:white}

</head>

<div class="app">
<h1>Italiensk hver dag 🇮🇹</h1>

<div class="settings">
<label for="wordType">Hvilke ord vil du øve på?</label>
<select id="wordType" onchange="changeType()">
<option value="all">Alle typer ord</option>
<option value="verb">Verb</option>
<option value="noun">Substantiv</option>
<option value="adjective">Adjektiv</option>
</select>
</div>

<div id="wordCard" class="card">
<div id="word" class="word"></div>
<div id="translation" class="translation"></div>
<div id="info" class="info"></div>
<button id="saveBtn" class="save" onclick="saveWord()">☆ Lagre ord</button>
<button class="next" onclick="next()">Neste ord →</button>
<div id="counter" class="counter"></div>
</div>



<button class="listButton" onclick="showSaved()">📚 Lagrede ord</button>
<button class="listButton" onclick="showActivity()">📊 Aktivitet</button>

<div id="activityPage" class="card savedList">
<h2>Aktivitet</h2>
<p>Her ser du hvor mange ganger du har trykket deg videre til et nytt ord.</p>
<div class="activityGrid">
<div class="activityBox"><div id="activityTotal" class="activityNumber">0</div><div class="activityLabel">Totalt</div></div>
<div class="activityBox"><div id="activityToday" class="activityNumber">0</div><div class="activityLabel">I dag</div></div>
<div class="activityBox"><div id="activitySession" class="activityNumber">0</div><div class="activityLabel">Denne økten</div></div>
<div class="activityBox"><div id="activityDays" class="activityNumber">0</div><div class="activityLabel">Aktive dager</div></div>
</div>
</div>

<div id="savedList" class="card savedList">
<h2>Lagrede ord</h2>
<div id="savedWords"></div>
</div>
</div>

// Kvalitetssikring av ordlisten: fjern dubletter og blokker ugyldige oversettelser.
// Dette gjør også at gamle placeholder-verdier ikke kan vises dersom en eldre versjon
// av appen ligger lagret i nettleseren.
const INVALID_TRANSLATIONS = /^(se\s+forklaring|forklaring|se\s+mer|ukjent|undefined|null|-)$/i;
const seenWords = new Set();
for (let i = words.length - 1; i >= 0; i--) {
  const w = words[i];
  const key = String(w[0] || "").trim().toLocaleLowerCase("it");
  const translation = String(w[1] || "").trim();
  if (!key || !translation || INVALID_TRANSLATIONS.test(translation) || seenWords.has(key)) {
    words.splice(i, 1);
  } else {
    seenWords.add(key);
  }
}

function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function resetQueue(){
 queue=shuffle(filteredWords());

function currentWord(){

function todayKey(){
 const d=new Date();
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function recordWordClick(){
 sessionWordClicks++;
 activity.total++;
 const day=todayKey();
 activity.days[day]=(activity.days[day]||0)+1;
 localStorage.setItem("italianActivity",JSON.stringify(activity));
 renderActivity();
}

function renderActivity(){
 const day=todayKey();
 document.getElementById("activityTotal").textContent=activity.total||0;
 document.getElementById("activityToday").textContent=activity.days[day]||0;
 document.getElementById("activitySession").textContent=sessionWordClicks;
 document.getElementById("activityDays").textContent=Object.keys(activity.days).filter(k=>activity.days[k]>0).length;
}

function showActivity(){
 const el=document.getElementById("activityPage");
 el.style.display=el.style.display==="block"?"none":"block";
 renderActivity();
}

function displayWord(){
 document.getElementById("wordCard").style.display="block";
 const w=currentWord();
 document.getElementById("word").textContent=w[0];
 document.getElementById("translation").textContent=w[1];
 const ex=exampleFor(w);
 document.getElementById("info").innerHTML="<b>Eksempel:</b> <i>"+ex.it+"</i><br><br><b>Norsk:</b> "+ex.no;
 document.getElementById("counter").textContent=(queuePos+1)+" / "+filteredWords().length+" før listen blandes på nytt";
 updateSave();
}

function next(){
 clicks++;
 recordWordClick();
 queuePos++;
 if(queuePos>=queue.length) resetQueue();
 displayWord();
}

function saveWord(){
 const w=currentWord();
 const pos=saved.findIndex(x=>x[0]===w[0]);
 if(pos===-1) saved.push(w); else saved.splice(pos,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 updateSave();
 renderSaved();
}

function updateSave(){
 const current=currentWord();
 const yes=current && saved.some(x=>x[0]===current[0]);
 const b=document.getElementById("saveBtn");
 b.textContent=yes?"★ Lagret":"☆ Lagre ord";
 b.className=yes?"save savedButton":"save";
}

function showSaved(){
 const el=document.getElementById("savedList");
 el.style.display=el.style.display==="block"?"none":"block";
 renderSaved();
}

function renderSaved(){
 const el=document.getElementById("savedWords");
 if(!saved.length){el.innerHTML="<p>Ingen lagrede ord ennå.</p>";return;}
 el.innerHTML=saved.map((w,i)=>"<div class='item'><b>"+w[0]+"</b> – "+w[1]+"<br><button class='remove' onclick='removeWord("+i+")'>Fjern</button></div>").join("");
}

function removeWord(i){
 saved.splice(i,1);
 localStorage.setItem("savedItalianWords",JSON.stringify(saved));
 renderSaved();
 updateSave();
}

document.getElementById("wordType").value=selectedType;
resetQueue();
displayWord();
renderSaved();
renderActivity();
